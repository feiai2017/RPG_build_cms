rules:
  str_to_hp: 20.0
  agi_to_crit_rate: 0.002
  int_to_inc_elemental: 0.02
  base_hp: 500.0
  mvp:
    allowed_models:
    - model_human
    allowed_talents:
    - talent_berserker
    - talent_thick_skin
    - talent_glass_cannon
    allowed_skills:
    - mvp_basic_attack
    - mvp_crit_execute
    - mvp_emergency_mend
    allowed_modifiers:
    - mvp_mod_damage_20
    - mvp_mod_crit_10
    - mvp_mod_haste
    - mvp_mod_tough
    allowed_conditions:
    - on_hit
    - on_crit
    - fixed_chance_20
    - hp_lt_30
    max_triggers: 2
    max_depth: 1
    enemy_presets:
      - id: dps_check
        name: 💀 木桩巨人 (高血量/低伤/短时间)
        desc: 专门制裁磨磨唧唧的肉盾，逼你堆输出。
        enemy_hp: 15000       # 血超级厚
        enemy_dps: 10         # 打人像挠痒
        max_time: 15          # 时间很紧，15秒打不完就输
        boss_crit_interval: 4.0
        boss_crit_mult: 2.5
      - id: survival_check
        name: 👹 狂暴刺客 (脆皮/秒杀级伤害)
        desc: 专门制裁玻璃大炮，一刀一个小朋友。
        enemy_hp: 2000        # 血很少，随便摸几下就死
        enemy_dps: 150        # 平A就很痛
        max_time: 30          # 时间充裕，只要活着就能赢
        boss_crit_interval: 4.0
        boss_crit_mult: 2.5
      - id: spike_check
        name: 🗡️ 蓄力重击者 (稳定压血/周期秒杀)
        desc: 平时伤害一般，但每隔一段时间必出“重击”——用来检验你的抗爆/应急逻辑是否真的闭环。
        enemy_hp: 6000
        enemy_dps: 35
        max_time: 25
        boss_crit_interval: 3.0
        boss_crit_mult: 4.0
models:
- id: model_orc
  name: 兽人素体 (高力)
  attributes:
    str: 40
    agi: 10
    int: 5
  base_stats:
    base_atk: 50
    crit_dmg: 1.5
    max_hp_bonus: 200
- id: model_elf
  name: 精灵素体 (高敏)
  attributes:
    str: 10
    agi: 40
    int: 15
  base_stats:
    base_atk: 30
    crit_dmg: 2.0
    max_hp_bonus: 0
- id: model_human
  name: 人类素体 (均衡)
  attributes:
    str: 25
    agi: 25
    int: 25
  base_stats:
    base_atk: 40
    crit_dmg: 1.7
    max_hp_bonus: 100
- id: model_dwarf
  name: 矮人素体 (高耐/高血)
  attributes:
    str: 35
    agi: 12
    int: 8
  base_stats:
    base_atk: 45
    crit_dmg: 1.5
    max_hp_bonus: 350
- id: model_undead
  name: 亡灵素体 (诅咒/暗伤倾向)
  attributes:
    str: 18
    agi: 18
    int: 32
  base_stats:
    base_atk: 35
    crit_dmg: 1.6
    max_hp_bonus: 50
talents:
- id: talent_berserker
  name: 狂战血统 (平衡/吸血)
  desc: 兼顾生存与输出，依赖低血运作。
  dynamic_stats:
    inc_physical: 0.3
    max_hp_bonus: 100
- id: talent_scholar
  name: 奥术智慧
  desc: 智力转化为暴击率 (每 10 点智力 + 1% 暴击)
  dynamic_stats:
    crit_rate: stats['int'] / 10 * 0.01
- id: talent_glass_cannon
  name: 玻璃大炮 (极端输出)
  desc: 伤害大幅提升，但生命值减半。
  dynamic_stats:
    more_damage: 0.5        # 50% 独立增伤 (巨强)
    max_hp_mult: 0.6        # 生命上限变为 60% (巨脆)
- id: talent_precision
  name: 精准猎手
  desc: 敏捷越高，暴击伤害越高（每 20 点敏捷 +10% 暴伤）
  dynamic_stats:
    crit_dmg: stats['agi'] / 20 * 0.10
- id: talent_thick_skin
  name: 龟壳姿态 (极端生存)
  desc: 极度耐打，但几乎没有输出能力。
  dynamic_stats:
    damage_taken_mult: 0.4  # 受伤减少 60% (巨硬)
    more_damage: -0.5       # 伤害降低 50% (打不动人)
- id: talent_blood_magic
  name: 血之魔法
  desc: 生命缺失越多，法术获得独立乘区（缺失 1% HP => +0.5% More Spell）
  dynamic_stats:
    more_spell: missing_hp_pct * 0.005
- id: talent_executioner
  name: 处决者
  desc: '对低血量敌人造成额外伤害 (模拟环境: 默认视为满足条件 +30% More)'
  dynamic_stats:
    more_damage: '0.30'
skills:
- id: skill_blood_strike
  name: 嗜血狂攻
  desc: 狂暴的近战攻击，武器系数极高
  tags:
  - attack
  - melee
  - physical
  damage_components:
  - type: physical
    min: 80
    max: 100
    weapon_scale: 1.2
- id: skill_fireball
  name: 大火球
  desc: 经典的火系法术，享受极高的智力加成
  tags:
  - spell
  - fire
  damage_components:
