- id: skill_poison_dart
  name: 淬毒飞镖
  desc: 发射带毒的飞镖，受敏捷加成
  tags:
  - attack
  - projectile
  - poison
  damage_components:
  - type: poison
    min: 35
    max: 35
    scaling_source: agi
    scaling_coef: 1.5
- id: skill_shadow_bolt
  name: 暗影箭
  desc: 凝聚黑暗能量的箭矢，造成暗影伤害
  tags:
  - spell
  - dark
  damage_components:
  - type: dark
    min: 55
    max: 65
    scaling_source: int
    scaling_coef: 2.0
- id: mvp_basic_attack
  name: MVP·基础连击
  desc: 稳定的主技能底座，用于触发 on_hit / on_crit。适合挂载攻速/暴击模组来放大触发收益。
  tags:
  - attack
  - physical
  - mvp
  damage_components:
  - type: physical
    min: 6
    max: 10
    scaling_source: base_atk
    scaling_coef: 0.35
- id: mvp_crit_execute
  name: MVP·暴击处决
  desc: 高伤子技能，适合 on_crit 触发。用来制造“爆发 BD”。
  tags:
  - attack
  - physical
  - mvp
  damage_components:
  - type: physical
    min: 40
    max: 60
    scaling_source: base_atk
    scaling_coef: 1.1
- id: mvp_emergency_mend
  name: MVP·金蝉护体
  desc: 低血保命技：回血 + 短暂减伤（带内置冷却）。用来验证“低血翻盘闭环”。
  tags:
  - spell
  - defense
  - mvp
  damage_components:
  - type: physical
    min: 0
    max: 0
    scaling_source: base_atk
    scaling_coef: 0.0
  effects:
    heal_percent_max_hp: 0.25
    icd: 6.0
    damage_taken_mult: 0.55
    duration: 1.5
