<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>五行同心环棋盘</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7/dist/pixi.min.js"></script>
</head>
<body>
  <div id="app">
    <div id="canvas-container"></div>
    <div id="panel">
      <div class="panel-header">五行棋盘 · 参数面板</div>
      <div class="panel-group">
        <label><input type="checkbox" id="toggle-sectors" checked /> 显示扇区底色</label>
        <label><input type="checkbox" id="toggle-rings" checked /> 显示环线</label>
        <label><input type="checkbox" id="toggle-edges" checked /> 显示连线</label>
      </div>
      <div class="panel-group">
        <label>Glow 强度 <input type="range" id="glow-strength" min="0" max="1" step="0.01" value="0.18" /></label>
        <label>Edges 强度 <input type="range" id="edge-strength" min="0.1" max="1" step="0.01" value="0.55" /></label>
        <label>Sector 透明度 <input type="range" id="sector-opacity" min="0" max="0.12" step="0.005" value="0.05" /></label>
        <label>Ring 强度 <input type="range" id="ring-strength" min="0.1" max="1" step="0.01" value="0.55" /></label>
        <label>缩放 <input type="range" id="scale" min="0.6" max="1.6" step="0.01" value="1" /></label>
      </div>
      <div class="panel-group">
        <label>搜索 node_id</label>
        <input type="text" id="search" placeholder="例如 r2-木-3" />
        <div id="search-result"></div>
      </div>
    </div>
    <div id="tooltip" class="tooltip"></div>
  </div>
  <script src="board.js"></script>
</body>
</html>
