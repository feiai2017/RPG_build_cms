<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>战斗日志 · 五行天赋盘</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="log-page">
  <div class="log-app" id="log-app">
    <div class="log-header">
      <h1>战斗日志</h1>
      <div class="log-actions">
        <button id="refresh-log">刷新</button>
        <a href="index.html">返回棋盘</a>
      </div>
    </div>

    <div class="log-summary">
      <div class="log-card" id="bd-summary"></div>
      <div class="log-card" id="fight-summary"></div>
      <div class="log-card" id="result-summary"></div>
    </div>

    <div class="log-main">
      <div class="log-card">
        <div class="log-section-title">构筑信息</div>
        <ul class="log-list" id="bd-info"></ul>
        <div class="log-section-title" style="margin-top:10px;">灵石分布</div>
        <ul class="log-list" id="stone-info"></ul>
      </div>
      <div class="log-table-wrap">
        <table class="log-table">
          <thead>
            <tr>
              <th>Tick</th>
              <th>时间</th>
              <th>来源</th>
              <th>目标</th>
              <th>数值</th>
              <th>类型</th>
              <th>伤害/效果</th>
              <th>备注</th>
              <th>Boss HP</th>
              <th>玩家 HP</th>
            </tr>
          </thead>
          <tbody id="log-table-body"></tbody>
        </table>
        <div class="log-empty hidden" id="log-empty">没有战斗日志，请回到棋盘点击 Simulate。</div>
      </div>
    </div>
  </div>

  <script src="battle_log.js"></script>
</body>
</html>
